<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>机芯透视展示系统</title>
  <style>
    :root {
      --bg: #14161a;
      --bg2: #1c1f26;
      --panel: #22262f;
      --border: #333947;
      --fg: #e6e9ef;
      --fg-dim: #9aa3b2;
      --accent: #c9a35c;
      --accent-dim: #8a713f;
      --danger: #d06a6a;
      --ok: #6fbf8f;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    header.app {
      display: flex; align-items: center; gap: 18px;
      padding: 0 18px; height: 52px; flex: 0 0 auto;
      background: var(--bg2); border-bottom: 1px solid var(--border);
    }
    header.app .brand { font-size: 16px; font-weight: 600; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
    nav.tabs { display: flex; gap: 4px; height: 100%; }
    nav.tabs a {
      display: flex; align-items: center; padding: 0 16px; height: 100%;
      color: var(--fg-dim); text-decoration: none; border-bottom: 2px solid transparent;
    }
    nav.tabs a:hover { color: var(--fg); }
    nav.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
    #current-movement-label { margin-left: auto; color: var(--fg-dim); font-size: 13px; }
    #current-movement-label b { color: var(--fg); font-weight: 600; }
    main { flex: 1 1 auto; overflow: auto; position: relative; }
    .page { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
    .page.full { max-width: none; padding: 0; height: 100%; }
    h2 { font-size: 18px; margin: 0 0 16px; color: var(--fg); }
    h3 { font-size: 15px; margin: 20px 0 10px; color: var(--fg); }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
    }
    table.data { width: 100%; border-collapse: collapse; }
    table.data th, table.data td {
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
      font-size: 13px; white-space: nowrap;
    }
    table.data th { color: var(--fg-dim); font-weight: 500; }
    table.data tr:hover td { background: rgba(255,255,255,0.02); }
    table.data tr.current td { background: rgba(201,163,92,0.08); }
    button, .btn {
      background: #2b303c; color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    }
    button:hover { border-color: var(--accent-dim); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 600; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: 0.45; cursor: default; }
    input[type="text"], input[type="number"], select, textarea {
      background: #171a20; color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 8px; font-size: 13px; font-family: inherit;
    }
    input[type="number"] { width: 76px; }
    input[type="range"] { accent-color: var(--accent); }
    label.field { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    label.field > span:first-child { width: 130px; color: var(--fg-dim); flex: 0 0 auto; }
    label.field input[type="range"] { flex: 1; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--fg-dim); font-size: 12px; }
    .ok { color: var(--ok); }
    .warn { color: #e0b45c; }
    .bad { color: var(--danger); }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #2b303c; border: 1px solid var(--border); }
    /* display page */
    #display-layout { display: flex; height: 100%; }
    #canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; background: radial-gradient(ellipse at 50% 40%, #232733 0%, #101216 75%); }
    #gpu-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #display-side {
      flex: 0 0 300px; background: var(--bg2); border-left: 1px solid var(--border);
      padding: 14px; overflow-y: auto;
    }
    #webgpu-fallback {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--bg); z-index: 10; text-align: center; padding: 30px;
    }
    #webgpu-fallback .box { max-width: 520px; }
    #timing-hud {
      position: absolute; left: 12px; top: 10px; font: 12px/1.6 ui-monospace, Consolas, monospace;
      color: var(--fg-dim); background: rgba(10,12,16,0.55); padding: 6px 10px; border-radius: 6px;
      pointer-events: none; white-space: pre;
    }
    #gear-tooltip {
      position: absolute; pointer-events: none; display: none;
      background: rgba(16,18,24,0.92); border: 1px solid var(--accent-dim);
      border-radius: 6px; padding: 8px 10px; font-size: 12px; z-index: 5; white-space: pre;
    }
    .toolbar { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; z-index: 4; }
    .empty-hint { color: var(--fg-dim); padding: 40px 0; text-align: center; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="app">
    <div class="brand">机芯透视展示系统</div>
    <nav class="tabs" id="tabs">
      <a href="#/list" data-route="list">机芯列表</a>
      <a href="#/editor" data-route="editor">轮系编辑</a>
      <a href="#/finish" data-route="finish">打磨装饰</a>
      <a href="#/display" data-route="display">展示</a>
      <a href="#/settings" data-route="settings">设置</a>
    </nav>
    <div id="current-movement-label"></div>
  </header>
  <main id="main"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
